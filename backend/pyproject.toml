[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6", "httpx>=0.28,<1", "boto3>=1.36,<2",
  "PyJWT[crypto]>=2.10,<3", "prometheus-client>=0.21,<1",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1", "opentelemetry-sdk>=1.30,<2"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=6,<7", "ruff>=0.11,<1", "aiosmtpd>=1.4.6,<2", "setuptools>=75", "wheel>=0.45"]
[tool.setuptools.packages.find]
include = ["atlasops*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
